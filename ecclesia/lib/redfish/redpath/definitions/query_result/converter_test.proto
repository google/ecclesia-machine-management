syntax = "proto3";

package ecclesia;

option java_outer_classname = "ConverterTest";
option java_multiple_files = true;

// This proto is used for test only.
message ConverterTestProto {
  int32 int32_val = 1;
  int64 int64_val = 2;
  uint32 uint32_val = 3;
  uint64 uint64_val = 4;
  float float_val = 5;
  double double_val = 6;
  bool bool_val = 7;
  string string_val = 8;

  enum EnumType {
    UNKNOWN = 0;
    VALUE = 1;
  }
  EnumType enum_val = 9;

  message NestedMessage {
    string nested_str = 1;
  }
  NestedMessage nested_msg = 10;

  repeated string repeated_str = 11;
  repeated int32 repeated_int = 12;
  repeated NestedMessage repeated_msg = 13;

  map<string, string> simple_map = 14;

  message MapContainer {
    map<string, int32> nested_map = 1;
  }
  repeated MapContainer repeated_map = 15;

  message RepeatedContainer {
    repeated string repeated_val = 1;
  }
  map<string, RepeatedContainer> map_with_repeated = 16;
}
